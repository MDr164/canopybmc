#@TYPE: Machine
#@NAME: Canopy AST2700 DC-SCM demo
#@DESCRIPTION: Canopy demo target for the ASPEED AST2700-DCSCM reference
#              board (AST2700 A2, single node). Non-PFR, unsigned image.

require conf/machine/include/ast2700-sdk.inc
require conf/machine/include/ast-ssp.inc
require conf/machine/include/ast-tsp.inc
require conf/machine/include/ast2700-secure-customize-gen.inc
require conf/machine/include/obmc-bsp-common.inc

# Canopy demo builds are unsigned. The on-board AST1060 currently approves
# everything, so skip ASPEED secure-boot image generation and OTP signing.
ASPEED_CUSTOMIZE_GEN_SECURE_IMAGE_ENABLE = "0"

# 64 MiB BMC flash layout (matches the ASPEED DCSCM reference).
FLASH_SIZE = "65536"
FLASH_UBOOT_OFFSET:flash-65536 = "0"
FLASH_UBOOT_ENV_OFFSET:flash-65536 = "4096"
FLASH_KERNEL_OFFSET:flash-65536 = "4224"
FLASH_ROFS_OFFSET:flash-65536 = "13440"
FLASH_RWFS_OFFSET:flash-65536 = "50944"

# Prebuilt bring-up binaries (A2 single node) provided by the ASPEED SDK.
CALIPTRA_FW_BINARY = "caliptra-fw-v2.bin"
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"

# U-Boot build settings.
UBOOT_MACHINE = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "ast2700-dcscm"

# Kernel device tree. The dcscm-demo DTS (#include of the in-tree
# ast2700-dcscm.dts) carries Canopy demo tweaks: power-control line names,
# PMBus PSU, host SPI hand-off. See recipes-kernel/linux/linux-aspeed_%.bbappend.
KERNEL_DEVICETREE = "aspeed/dcscm-demo.dtb"
KBUILD_DEFCONFIG = "aspeed_g7_defconfig"

MACHINE_FEATURES += "\
        obmc-phosphor-fan-mgmt \
        obmc-phosphor-chassis-mgmt \
        obmc-phosphor-flash-mgmt \
        obmc-host-ipmi \
        obmc-host-state-mgmt \
        obmc-chassis-state-mgmt \
        obmc-bmc-state-mgmt \
        "

PREFERRED_PROVIDER_virtual/obmc-system-mgmt = "packagegroup-aspeed-obmc"
PREFERRED_PROVIDER_virtual/obmc-host-ipmi-hw = "phosphor-ipmi-kcs"
VIRTUAL-RUNTIME_obmc-host-state-manager ?= "x86-power-control"
VIRTUAL-RUNTIME_obmc-chassis-state-manager ?= "x86-power-control"

EXTRA_IMAGEDEPENDS:append = " \
    aspeed-image-recoveryuart \
    "

# --- ASPEED SDK vs Canopy userspace de-confliction (demo) ---
# The vendored ASPEED SDK targets ASPEED's reference distro against an OLDER
# meta-phosphor than Canopy pins. It patches many userspace apps (bmcweb,
# obmc-ikvm, console, dbus-sensors, software-manager, ipmi, ...) and even rolls
# webui-vue back to an older SRCREV. Those collide with Canopy's branded
# bmcweb/webui-vue and the newer meta-phosphor.
#
# Principle: Canopy owns the userspace surface; the ASPEED SDK provides only the
# BSP (kernel, u-boot, TF-A, OP-TEE, Zephyr, Caliptra, image assembly). So mask
# ALL of the ASPEED SDK's userspace *.bbappend overlays in both layers. This
# keeps its standalone recipes (usb-gadget, spdmtool, libmctp-intel, ...) and
# the whole BSP intact. Re-introduce individual pieces later, rebased onto the
# current meta-phosphor, as demo features are wired up.
BBMASK += "vendor/meta-aspeed-sdk/.*recipes-phosphor/.*\.bbappend"
BBMASK += "vendor/meta-aspeed-sdk/.*recipes-graphics/.*\.bbappend"

# Belt-and-suspenders: demote any residual patch context drift (fuzz) from a
# fatal QA error to a warning so the demo build proceeds.
ERROR_QA:remove = "patch-fuzz"
WARN_QA:append = " patch-fuzz"

# --- Demo mode (on by default on this showcase image) ---
# Build the WebUI demo UI mode into webui-vue (mock Redfish data + "Settings >
# Demo mode" toggle), defaulted ON. The canopy-demo userspace tools (fake D-Bus
# inventory/sensors + SOL boot-log replay) are pulled into the image by
# recipes-phosphor/images/obmc-phosphor-image.bbappend and enabled by default.
CANOPY_WEBUI_DEMO = "1"
