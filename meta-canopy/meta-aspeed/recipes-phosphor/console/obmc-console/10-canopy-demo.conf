# Drop-in for the recipe-generated obmc-console@ttyDEMO.service instance.
#
# The demo console only exists while canopy-demo mode is on: /dev/ttyDEMO is a
# PTY created by canopy-demo-console.service. Gate this instance on both the demo
# flag and the PTY so it is silently skipped at boot when demo mode is off, and
# is (re)started by canopy-demo-console once the PTY appears.
[Unit]
ConditionPathExists=/var/lib/canopy-demo/enabled
# /dev/ttyDEMO is created by canopy-demo-console.service (socat). Skip this
# instance until the PTY exists; canopy-demo-console (re)starts it once it does.
ConditionPathExists=/dev/ttyDEMO
After=canopy-demo-console.service
BindsTo=canopy-demo-console.service
