# Canopy demo console.
#
# dcscm-demo ships no real host UART console yet (the SDK's console bbappends are
# masked for this machine). This defines the default host console the WebUI SOL
# window connects to, backed by a PTY (/dev/ttyDEMO) that canopy-demo-console
# feeds with a pre-recorded boot log. Replace/rename once a real host UART
# console is wired up.
console-id = default
local-tty = ttyDEMO
local-tty-baud = 115200
baud = 115200
logsize = 256k
logfile = /var/log/obmc-console-demo.log
